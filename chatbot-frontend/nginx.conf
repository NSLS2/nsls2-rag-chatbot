server {
  listen 3000;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  # Single Page App fallback
  location / {
    try_files $uri $uri/ /index.html;
  }
  # Optional: proxy API to backend if needed (uncomment)
  # location /api/ {
  #   proxy_pass http://backend:8000/;
  # }
}
